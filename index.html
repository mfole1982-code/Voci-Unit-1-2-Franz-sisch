<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Französisch Flashcards</title><style>
:root{--green:#82a91f;--bg:#f5f7f2;--ink:#172016}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 10%,#dff3a5 0,transparent 27%),radial-gradient(circle at 90% 20%,#cbe9ff 0,transparent 25%),linear-gradient(160deg,#f8fbf4,#edf6ff);color:var(--ink);min-height:100vh}main{max-width:760px;margin:auto;padding:22px}h1{margin:0}.sub{color:#667060;margin:6px 0 18px}.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.bar{height:8px;background:#dce4d5;border-radius:9px;overflow:hidden;margin:9px 0 16px}#fill{height:100%;background:var(--green)}#card{width:100%;min-height:310px;background:linear-gradient(145deg,#fff,#fbfff3);border:1px solid #ffffffaa;border-radius:28px;box-shadow:0 18px 50px #20301022, inset 0 1px #fff;padding:28px;cursor:pointer;color:inherit;transition:transform .2s,box-shadow .2s}#card:hover{transform:translateY(-4px);box-shadow:0 24px 60px #2030102c}#card:active{transform:scale(.985)}#lang{display:inline-block;color:#fff;background:linear-gradient(90deg,#76a313,#9bcf29);padding:7px 12px;border-radius:999px;font-weight:900;letter-spacing:.12em;font-size:12px}#word{font-size:clamp(32px,7vw,52px);font-weight:900;margin:62px 0 22px;letter-spacing:-.03em}#hint{color:#777}.actions{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:9px;margin-top:13px}.tools{display:flex;gap:9px;margin-top:9px}button,select{font:inherit}.btn,select{border:0;border-radius:14px;padding:13px;background:#e5ebdc;color:#24301d;font-weight:700}.primary{background:linear-gradient(90deg,#78a918,#9acb2d);color:white;box-shadow:0 8px 18px #78a91833}.tools .btn{flex:1}select{width:100%;margin-top:10px;background:white;border:1px solid #d5ddce}button:focus,select:focus{outline:3px solid #bfd76f;outline-offset:2px}@media(max-width:480px){main{padding:14px}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1;grid-row:1}}@media(prefers-color-scheme:dark){:root{--bg:#182016;--ink:#f3f6f0}#card,select{background:#273022;color:#f3f6f0}.btn{background:#35412f;color:#f3f6f0}.primary{background:#82a91f}}
</style></head><body><main><h1>✨ Französisch Challenge 🇫🇷</h1><div class="sub">Deutsch sehen · Französisch wissen · Karte antippen zum Auflösen</div><div class="row"><span id="count"></span><span id="mode"></span></div><div class="bar"><div id="fill"></div></div><button id="card" type="button"><div id="lang"></div><div id="word"></div><div id="hint"></div></button><div class="actions"><button class="btn" id="prev" type="button">← Zurück</button><button class="btn primary" id="flip" type="button">↻ Umdrehen</button><button class="btn" id="next" type="button">Weiter →</button></div><div class="tools"><button class="btn" id="shuffle" type="button">🔀 Mischen</button><button class="btn" id="direction" type="button" disabled>🇩🇪 → 🇫🇷</button></div><select id="set"><option value="Alle">Alle Wörter</option><option value="Schule">Schule & Schulfächer</option><option value="Familie">Familie</option></select></main><script>
const all=[["le livre", "das Buch", "Schule"], ["la règle", "das Lineal", "Schule"], ["le classeur", "der Ordner", "Schule"], ["le cahier", "das Heft", "Schule"], ["le crayon", "der Bleistift", "Schule"], ["le stylo", "der Kugelschreiber", "Schule"], ["la gomme", "der Gummi", "Schule"], ["le tableau noir", "die Wandtafel", "Schule"], ["la trousse", "das Etui", "Schule"], ["la table", "der Tisch", "Schule"], ["la chaise", "der Stuhl", "Schule"], ["la matière scolaire", "das Schulfach", "Schule"], ["l’allemand", "Deutsch", "Schule"], ["le français", "Französisch", "Schule"], ["l’anglais", "Englisch", "Schule"], ["les maths, les mathématiques", "Mathematik", "Schule"], ["les jours de la semaine", "die Wochentage", "Schule"], ["lundi", "Montag", "Schule"], ["mardi", "Dienstag", "Schule"], ["mercredi", "Mittwoch", "Schule"], ["jeudi", "Donnerstag", "Schule"], ["vendredi", "Freitag", "Schule"], ["samedi", "Samstag", "Schule"], ["dimanche", "Sonntag", "Schule"], ["une école", "eine Schule", "Schule"], ["calculer", "rechnen", "Schule"], ["dessiner", "zeichnen", "Schule"], ["chanter", "singen", "Schule"], ["expérimenter", "experimentieren", "Schule"], ["parler français", "Französisch sprechen", "Schule"], ["la famille", "die Familie", "Familie"], ["un/une enfant", "ein Kind", "Familie"], ["la mère, la maman", "die Mutter", "Familie"], ["le père, le papa", "der Vater", "Familie"], ["les parents", "die Eltern", "Familie"], ["la sœur", "die Schwester", "Familie"], ["le frère", "der Bruder", "Familie"], ["la grand-mère", "die Grossmutter", "Familie"], ["le grand-père", "der Grossvater", "Familie"], ["les grands-parents", "die Grosseltern", "Familie"], ["la tante", "die Tante", "Familie"], ["un oncle", "ein Onkel", "Familie"], ["la cousine", "die Cousine", "Familie"], ["le cousin", "der Cousin", "Familie"], ["le bébé", "das Baby, das Kleinkind", "Familie"], ["la fille", "die Tochter, das Mädchen", "Familie"], ["le fils", "der Sohn", "Familie"], ["voici, voilà", "hier ist, da ist", "Familie"], ["il est, elle est", "er ist, sie ist", "Familie"], ["Lionel est le frère de Nathalie.", "Lionel ist der Bruder von Nathalie.", "Familie"], ["ils sont, elles sont", "sie sind", "Familie"], ["c’est", "das ist", "Familie"], ["C’est ma famille.", "Das ist meine Familie.", "Familie"], ["ce sont", "das sind", "Familie"], ["Ce sont mes grands-parents.", "Das sind meine Grosseltern.", "Familie"], ["qui ?", "wer?", "Familie"], ["il s’appelle, elle s’appelle", "er heisst, sie heisst", "Familie"], ["ils s’appellent, elles s’appellent", "sie heissen", "Familie"], ["la fiche personnelle", "der Steckbrief", "Familie"], ["le nom", "der Name", "Familie"], ["le prénom", "der Vorname", "Familie"], ["la langue", "die Sprache", "Familie"], ["Je parle allemand, français et anglais.", "Ich spreche Deutsch, Französisch und Englisch.", "Familie"]];let cards=[...all],i=0,back=false,reverse=true;const $=x=>document.querySelector(x);function render(){let c=cards[i];$('#word').textContent=back?(reverse?c[0]:c[1]):(reverse?c[1]:c[0]);$('#lang').textContent=back?'ANTWORT':(reverse?'DEUTSCH':'FRANZÖSISCH');$('#hint').textContent=back?'Antippen für die Vorderseite':'Antippen, um die Antwort zu sehen';$('#count').textContent=`${i+1} / ${cards.length}`;$('#fill').style.width=`${(i+1)/cards.length*100}%`;$('#mode').textContent=reverse?'Deutsch → Französisch':'Französisch → Deutsch'}function flip(){back=!back;render()}$('#card').onclick=flip;$('#flip').onclick=flip;$('#next').onclick=()=>{i=(i+1)%cards.length;back=false;render()};$('#prev').onclick=()=>{i=(i-1+cards.length)%cards.length;back=false;render()};$('#direction').onclick=()=>{reverse=true;back=false;render()};$('#shuffle').onclick=()=>{for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}i=0;back=false;render()};$('#set').onchange=e=>{cards=e.target.value==='Alle'?[...all]:all.filter(c=>c[2]===e.target.value);i=0;back=false;render()};render();
</script></body></html>
